<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>畫廊</title>
    <link rel="stylesheet" href="css/start.css" />
    <style>
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }

        .card {
            border: 1px solid #444;
            background: #1a1a1a;
            padding: 8px;
        }

        .card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            display: block;
        }

        .card p {
            margin: 6px 0 0;
            font-size: 13px;
            color: #ccc;
        }
    </style>
</head>

<body class="start-page">
    <div id="start-wrap">
        <p class="gold">畫廊</p>
        <p class="hint">目前只列 html_img 裡的圖。之後要加圖，把檔丟進 html_img，再在這裡多一張卡。</p>
        <div class="grid">
            <div class="card"><img src="html_img/start.jpg" alt="" />
                <p>start.jpg　標題橫幅</p>
            </div>
            <div class="card"><img src="html_img/cyrene.jpg" alt="" />
                <p>cyrene.jpg　側欄立繪</p>
            </div>
        </div>
        <p></p>
        <button type="button" id="btn-back">返回標題</button>
    </div>
    <script>
        document.getElementById("btn-back").addEventListener("click", function () {
            if (window.chrome && window.chrome.webview)
                window.chrome.webview.postMessage({ type: "nav", page: "start" });
        });
    </script>
</body>

</html>
